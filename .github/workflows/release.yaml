---
name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22"
          cache: ""

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🔨 Build frontend
        run: npm run build

      - name: 📝 Update version in manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          jq --arg v "$version" '.version = $v' \
            custom_components/pacman/manifest.json > tmp.json \
            && mv tmp.json custom_components/pacman/manifest.json

      - name: 📦 Create release zip
        run: |
          cd custom_components/pacman
          zip -r ../../pacman.zip .

      - name: 🚀 Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            pacman.zip
